<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ĩrhẽζ — Từ điển</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#12141a;
    --ink-2:#191c24;
    --parchment:#e9e4d4;
    --parchment-dim:#9a9686;
    --verdigris:#4fa893;
    --verdigris-dim:#33564d;
    --rust:#c97b4a;
    --line:#2a2e38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .bg-glyph{
    position:fixed;
    top:-8vw; right:-8vw;
    font-family:'Newsreader',serif;
    font-size:56vw;
    line-height:1;
    color:var(--verdigris);
    opacity:0.045;
    pointer-events:none;
    user-select:none;
    z-index:0;
  }
  header{
    position:relative;
    z-index:1;
    padding:44px 24px 28px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--verdigris);
    margin:0 0 10px;
  }
  h1{
    font-family:'Newsreader',serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(38px,11vw,60px);
    margin:0 0 6px;
    color:var(--parchment);
    letter-spacing:0.01em;
  }
  .sub{
    font-size:14.5px;
    color:var(--parchment-dim);
    margin:0;
    max-width:46ch;
    line-height:1.5;
  }
  .count{
    font-family:'JetBrains Mono',monospace;
    color:var(--rust);
    font-weight:500;
  }
  main{
    position:relative;
    z-index:1;
    padding:22px 24px 80px;
    max-width:640px;
    margin:0 auto;
  }
  .search-wrap{
    position:sticky;
    top:0;
    background:var(--ink);
    padding:16px 0 14px;
    z-index:5;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  input[type="text"]{
    width:100%;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:14px 16px;
    border-radius:2px;
    outline:none;
    transition:border-color 0.15s ease;
  }
  input[type="text"]::placeholder{color:var(--parchment-dim);}
  input[type="text"]:focus{border-color:var(--verdigris);}
  .status{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--parchment-dim);
    margin-top:10px;
    letter-spacing:0.02em;
  }
  .row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:4px 16px;
    padding:16px 0;
    border-bottom:1px solid var(--line);
    animation:fade 0.25s ease;
  }
  @keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:translateY(0);}}
  .vn{
    font-size:15px;
    color:var(--parchment);
    grid-column:1/3;
  }
  .vn mark{
    background:none;
    color:var(--rust);
    font-weight:600;
  }
  .forms{
    grid-column:1/3;
    display:flex;
    gap:22px;
    margin-top:2px;
  }
  .form-item{display:flex;flex-direction:column;gap:2px;}
  .form-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--verdigris-dim);
  }
  .form-value{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    color:var(--verdigris);
  }
  .form-value.mko{color:var(--rust);}
  .empty, .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--parchment-dim);
    font-size:14px;
  }
  .loading .glyph-spin{
    display:inline-block;
    font-family:'Newsreader',serif;
    font-size:28px;
    color:var(--verdigris);
    animation:spin 1.4s linear infinite;
    margin-bottom:14px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  button.more{
    display:block;
    width:100%;
    margin-top:20px;
    padding:14px;
    background:transparent;
    border:1px solid var(--verdigris-dim);
    color:var(--verdigris);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:0.05em;
    border-radius:2px;
    cursor:pointer;
  }
  button.more:active{background:var(--verdigris-dim);}
  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--parchment-dim);
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.03em;
    position:relative;
    z-index:1;
  }

  section.hub{
    margin-bottom:36px;
    padding-bottom:30px;
    border-bottom:1px solid var(--line);
  }
  .hub h2{
    font-family:'Newsreader',serif;
    font-style:italic;
    font-weight:600;
    font-size:24px;
    margin:0 0 14px;
    color:var(--parchment);
  }
  .video-wrap{
    width:100%;
    border-radius:2px;
    overflow:hidden;
    border:1px solid var(--line);
    margin-bottom:10px;
  }
  video{width:100%;display:block;background:#000;}
  .doc-link{
    display:inline-block;
    margin-top:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--verdigris);
    text-decoration:none;
    border:1px solid var(--verdigris-dim);
    padding:10px 14px;
    border-radius:2px;
  }
  .doc-link:active{background:var(--verdigris-dim);}
  .phon-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .phon-card{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:2px;
    padding:12px 8px;
    text-align:center;
  }
  .phon-sym{
    font-family:'Newsreader',serif;
    font-size:26px;
    color:var(--parchment);
    margin-bottom:2px;
  }
  .phon-read{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--parchment-dim);
    margin-bottom:8px;
  }
  .phon-play{
    background:transparent;
    border:1px solid var(--verdigris-dim);
    color:var(--verdigris);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:5px 8px;
    border-radius:2px;
    width:100%;
  }
  .phon-play:active{background:var(--verdigris-dim);}

  .gram-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .gram-tab{
    flex:1;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:10px 6px;
    border-radius:2px;
  }
  .gram-tab.active{
    border-color:var(--verdigris);
    color:var(--verdigris);
  }
  .gram-panel{display:none;}
  .gram-panel.active{display:block;}
  .gram-intro{
    font-size:13.5px;
    color:var(--parchment-dim);
    line-height:1.6;
    margin:0 0 16px;
  }
  .gram-rule{
    font-size:14px;
    line-height:1.65;
    color:var(--parchment);
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .gram-rule b{color:var(--verdigris);font-weight:600;}
  .gram-num{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--rust);
    border:1px solid var(--rust);
    border-radius:50%;
    width:20px;height:20px;
    text-align:center;
    line-height:18px;
    margin-right:8px;
  }
  .gram-note{
    margin-top:16px;
    font-size:12.5px;
    color:var(--parchment-dim);
    font-style:italic;
    line-height:1.6;
  }

  .top-nav{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    background:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .top-nav-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--parchment-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    letter-spacing:0.04em;
    padding:16px 0;
    border-bottom:2px solid transparent;
  }
  .top-nav-btn.active{
    color:var(--parchment);
    border-bottom-color:var(--rust);
  }
  .view{display:none;}
  .view.active{display:block;}

  .learn-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 0;
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
  }
  .hearts{
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    color:var(--rust);
    letter-spacing:2px;
  }
  .xp{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--verdigris);
  }
  .progress-bar{
    height:6px;
    background:var(--ink-2);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:28px;
  }
  .progress-fill{
    height:100%;
    background:var(--verdigris);
    transition:width 0.3s ease;
    width:0%;
  }
  .q-prompt{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--verdigris);
    margin-bottom:10px;
  }
  .q-word{
    font-family:'Newsreader',serif;
    font-style:italic;
    font-size:32px;
    color:var(--parchment);
    margin-bottom:28px;
    line-height:1.3;
  }
  .q-options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .q-opt{
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:15px;
    text-align:left;
    padding:16px;
    border-radius:2px;
  }
  .q-opt.correct{border-color:var(--verdigris);background:var(--verdigris-dim);color:var(--verdigris);}
  .q-opt.wrong{border-color:var(--rust);background:#3a2420;color:var(--rust);}
  .q-opt:disabled{opacity:0.55;}
  .learn-feedback{
    margin-top:20px;
    padding:14px;
    border-radius:2px;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    display:none;
  }
  .learn-feedback.show{display:block;}
  .learn-feedback.ok{background:var(--verdigris-dim);color:var(--verdigris);}
  .learn-feedback.bad{background:#3a2420;color:var(--rust);}
  .learn-next{
    display:block;
    width:100%;
    margin-top:16px;
    padding:15px;
    background:var(--verdigris);
    border:none;
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.03em;
    border-radius:2px;
  }
  .learn-end{
    text-align:center;
    padding:60px 20px;
  }
  .learn-end .big{
    font-family:'Newsreader',serif;
    font-style:italic;
    font-size:38px;
    color:var(--parchment);
    margin-bottom:12px;
  }
  .learn-restart{
    margin-top:24px;
    padding:14px 28px;
    background:transparent;
    border:1px solid var(--verdigris);
    color:var(--verdigris);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    border-radius:2px;
  }

  .ex-type-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--rust);
    margin-bottom:6px;
  }
  .clickable-word{
    color:var(--verdigris);
    font-weight:600;
    cursor:pointer;
    position:relative;
    border-bottom:1px dashed var(--verdigris-dim);
  }
  .word-tooltip{
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translateX(-50%);
    background:var(--rust);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:6px 10px;
    border-radius:2px;
    white-space:nowrap;
    margin-bottom:6px;
    z-index:20;
    display:none;
  }
  .word-tooltip.show{display:block;}

  .listen-box{text-align:center;padding:20px 0;}
  .listen-btn{
    width:88px;height:88px;
    border-radius:50%;
    background:var(--verdigris-dim);
    border:1px solid var(--verdigris);
    color:var(--verdigris);
    font-size:32px;
    margin-bottom:20px;
  }
  .listen-word{margin-top:18px;}
  .confirm-said{
    display:block;
    width:100%;
    margin-top:24px;
    padding:15px;
    background:var(--verdigris);
    border:none;
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:600;
    border-radius:2px;
  }

  .match-grid{display:flex;gap:14px;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
  .match-item{
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:13px 8px;
    border-radius:2px;
    text-align:center;
  }
  .match-item.selected{border-color:var(--rust);color:var(--rust);}
  .match-item.matched{border-color:var(--verdigris);color:var(--verdigris);opacity:0.5;}

  .build-target{
    min-height:52px;
    border-bottom:2px solid var(--verdigris-dim);
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
    margin-bottom:24px;
    padding-bottom:8px;
  }
  .build-tile-placed{
    background:var(--verdigris-dim);
    color:var(--verdigris);
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    padding:8px 12px;
    border-radius:2px;
  }
  .build-bank{display:flex;flex-wrap:wrap;gap:8px;}
  .build-tile{
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    padding:10px 14px;
    border-radius:2px;
  }
  .build-tile:disabled{opacity:0.25;}
  .build-clear{
    margin-top:16px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--parchment-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:8px 14px;
    border-radius:2px;
  }

  .settings-tabs{display:flex;gap:8px;margin-bottom:24px;}
  .settings-tab{
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:9px 16px;
    border-radius:2px;
  }
  .settings-tab.active{border-color:var(--verdigris);color:var(--verdigris);}
  .settings-panel{display:none;}
  .settings-panel.active{display:block;}
  .settings-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }
  .settings-row-label{font-size:14px;color:var(--parchment);}
  .settings-row-desc{font-size:12px;color:var(--parchment-dim);margin-top:3px;}
  .toggle-switch{
    width:46px;height:26px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:13px;
    position:relative;
    flex-shrink:0;
  }
  .toggle-switch.on{background:var(--verdigris-dim);border-color:var(--verdigris);}
  .toggle-knob{
    width:20px;height:20px;
    background:var(--parchment-dim);
    border-radius:50%;
    position:absolute;
    top:2px;left:2px;
    transition:left 0.2s ease;
  }
  .toggle-switch.on .toggle-knob{left:22px;background:var(--verdigris);}

  .account-box{
    max-width:360px;
    margin:20px auto 0;
    text-align:center;
  }
  .account-choice-btn{
    display:block;
    width:100%;
    padding:16px;
    margin-bottom:12px;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:14px;
    border-radius:2px;
  }
  .account-choice-btn.primary{border-color:var(--verdigris);color:var(--verdigris);}
  .account-form input{
    width:100%;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:13px 14px;
    border-radius:2px;
    margin-bottom:12px;
  }
  .account-form input:focus{outline:none;border-color:var(--verdigris);}
  .account-submit{
    width:100%;
    padding:14px;
    background:var(--verdigris);
    border:none;
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:600;
    border-radius:2px;
  }
  .account-msg{
    margin-top:14px;
    font-size:13px;
    font-family:'JetBrains Mono',monospace;
  }
  .account-msg.ok{color:var(--verdigris);}
  .account-msg.bad{color:var(--rust);}
  .account-back{
    margin-top:16px;
    background:transparent;
    border:none;
    color:var(--parchment-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
  }
  .account-logged{
    text-align:center;
    padding:40px 20px;
  }

  .avatar-picker{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:14px;
  }
  .avatar-opt{
    aspect-ratio:1;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:2px;
    font-family:'Newsreader',serif;
    font-size:26px;
    color:var(--parchment-dim);
    display:flex;align-items:center;justify-content:center;
  }
  .avatar-opt.selected{border-color:var(--verdigris);color:var(--verdigris);background:var(--verdigris-dim);}
  .profile-avatar{
    width:84px;height:84px;
    border-radius:50%;
    background:var(--verdigris-dim);
    border:1px solid var(--verdigris);
    font-family:'Newsreader',serif;
    font-size:38px;
    color:var(--verdigris);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
  }
  .profile-stat-row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .profile-stat-label{color:var(--parchment-dim);}
  .profile-stat-value{color:var(--verdigris);font-family:'JetBrains Mono',monospace;}
  .forgot-link{
    display:block;
    text-align:center;
    margin-top:10px;
    color:var(--parchment-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    background:none;border:none;
  }
  .lang-select{
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--parchment);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:8px 10px;
    border-radius:2px;
  }
</style>
</head>
<body>

<div class="bg-glyph">ζ</div>

<header>
  <p class="eyebrow">ĩrhẽζ · zẽhrĩ</p>
  <h1>Từ điển</h1>
  <p class="sub">Tra cứu song song hai hệ chữ — <span class="count" id="totalCount">…</span> mục từ, sinh theo đúng quy tắc âm vị học của ngôn ngữ.</p>
</header>

<div class="top-nav">
  <button class="top-nav-btn active" id="navMain" onclick="switchView('main')">Trang chính</button>
  <button class="top-nav-btn" id="navSettings" onclick="switchView('settings')">Cài đặt</button>
  <button class="top-nav-btn" id="navAccount" onclick="switchView('account')">Tài khoản</button>
  <button class="top-nav-btn" id="navLearn" onclick="switchView('learn')" style="display:none;">Học</button>
</div>

<main class="view active" id="viewMain">
  <section class="hub">
    <h2>Video học bảng chữ cái</h2>
    <div class="video-wrap">
